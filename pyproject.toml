[project]
name = "review-rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeremiah", email = "jeremiahpg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "ollama>=0.6.3",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "sentence-transformers>=6.2.0",
    "torch>=2.14,<2.15",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
    "weaviate-client>=4.24.1",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# The local NVIDIA driver supports CUDA 12.6, so pull torch from the cu126 index.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[project.scripts]
rra = "review_rag_assistant.cli:app"

[tool.ruff]
line-length = 120
